version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-desafio
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: desafio
    ports:
      - "3306:3306"

  wiremock:
    image: wiremock/wiremock:3.5.2
    container_name: wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: [ "--root-dir", "/home/wiremock" ]

  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=sqs,s3,sns
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=1
      - DEBUG=1
      - LS_LOG=trace
      - LOCALSTACK_AUTH_TOKEN=ls-bIdICISo-4352-JUFU-QIrI-NAPIMArA299d
    volumes:
      - ./localstack:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d